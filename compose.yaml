services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shiqi
      POSTGRES_USER: shiqi
      POSTGRES_PASSWORD: local-development-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiqi -d shiqi"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build: .
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 4173
      APP_ORIGIN: http://127.0.0.1:4173
      DATABASE_URL: postgres://shiqi:local-development-only@postgres:5432/shiqi
      PASSWORD_PEPPER: local-development-pepper-change-before-production
      UPLOAD_DIR: /data/uploads
    ports:
      - "4173:4173"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads-data:/data/uploads

volumes:
  postgres-data:
  uploads-data:
